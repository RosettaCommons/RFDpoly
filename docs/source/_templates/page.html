{% extends "!page.html" %}

{% block content %}
  {{ super() }}
  <div class="page-feedback" data-page="{{ pagename }}">
    <p class="page-feedback-question">Did you find what you were looking for?</p>
    <div class="page-feedback-buttons">
      <button type="button" class="page-feedback-button" data-helpful="yes" aria-label="Yes" title="Yes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
      </button>
      <button type="button" class="page-feedback-button" data-helpful="no" aria-label="No" title="No">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>
      </button>
    </div>
    <p class="page-feedback-thanks" role="status" hidden>Thanks for your feedback!</p>
  </div>
{% endblock %}
